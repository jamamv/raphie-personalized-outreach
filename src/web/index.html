<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raphie Outreach</title>
<style>
  :root {
    --bg: #faf9f6; --surface: #ffffff; --text: #1f1e1c; --muted: #6b6862; --line: #e6e3dc;
    --bubble: #efece6; --accent: #1f1e1c; --accent-text: #ffffff; --ok: #2f7a4a; --warn: #9a5b13; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1a18; --surface: #252421; --text: #ecebe7; --muted: #a29f97; --line: #393833;
      --bubble: #2f2e2a; --accent: #ecebe7; --accent-text: #1b1a18; --ok: #6cc28c; --warn: #e0a85a; --bad: #f2867d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); text-align: center; font-weight: 600; font-size: 15px; }
  header span { color: var(--muted); font-weight: 400; }
  main { flex: 1; overflow-y: auto; }
  .thread { max-width: 720px; margin: 0 auto; padding: 24px 16px 8px; display: flex; flex-direction: column; gap: 18px; }
  .msg { display: flex; gap: 12px; align-items: flex-start; }
  .msg.user { justify-content: flex-end; }
  .msg.user .text { background: var(--bubble); padding: 10px 14px; border-radius: 18px; max-width: 80%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .avatar { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; font-size: 13px; font-weight: 700; margin-top: 1px; }
  .msg.bot .body { flex: 1; min-width: 0; }
  .chips { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button { font: inherit; cursor: pointer; }
  .chip { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; padding: 6px 16px; }
  .chip:hover { border-color: var(--muted); }
  .card { margin-top: 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; overflow: hidden; }
  .card pre { margin: 0; padding: 16px 18px; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
  .actions { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .actions button { border: 0; background: transparent; color: var(--muted); padding: 6px 10px; border-radius: 8px; font-size: 14px; }
  .actions button:hover { background: var(--bubble); color: var(--text); }
  .meta { color: var(--muted); font-size: 14px; margin-top: 8px; }
  details { margin-top: 8px; font-size: 14px; color: var(--muted); }
  details summary { cursor: pointer; }
  details pre { margin: 8px 0 0; white-space: pre-wrap; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .note { color: var(--warn); font-size: 14px; margin-top: 6px; }
  .error { color: var(--bad); }
  .thinking { color: var(--muted); }
  .thinking::after { content: ''; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  footer { padding: 8px 16px 16px; }
  .composer { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; border: 1px solid var(--line); background: var(--surface); border-radius: 22px; padding: 8px 8px 8px 16px; }
  .composer:focus-within { border-color: var(--muted); }
  textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--text); font: inherit; max-height: 160px; padding: 6px 0; }
  .send { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; }
  .send:disabled { opacity: .35; cursor: default; }
  .hint { max-width: 720px; margin: 6px auto 0; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<header>Raphie Outreach <span>· cold email writer</span></header>
<main id="scroll"><div class="thread" id="thread"></div></main>
<footer>
  <form class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="Type your answer..." autocomplete="off"></textarea>
    <button class="send" id="send" type="submit" aria-label="Send" disabled>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 13V3M8 3L3.5 7.5M8 3l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </form>
  <p class="hint">Enter to send · Shift+Enter for a new line</p>
</footer>

<script>
const QUESTIONS = [
  { key: 'recipientName', ask: 'Hi. Who are you emailing? Their full name is fine.' },
  { key: 'companyName', ask: 'Which company do they work at?' },
  { key: 'description', ask: 'Describe the company in a sentence or two. What do they do, and what does their support team deal with?' },
  { key: 'tone', ask: 'Which tone should the email have?', choices: ['Direct', 'Warm'] },
];

const thread = document.getElementById('thread');
const scroller = document.getElementById('scroll');
const form = document.getElementById('composer');
const input = document.getElementById('input');
const send = document.getElementById('send');

let answers = {};
let step = 0;
let lookupId = null;
let busy = false;

const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
};
const scrollDown = () => scroller.scrollTo({ top: scroller.scrollHeight, behavior: 'smooth' });

function botMessage() {
  const row = el('div', 'msg bot');
  row.append(el('div', 'avatar', 'R'));
  const body = el('div', 'body');
  row.append(body);
  thread.append(row);
  scrollDown();
  return body;
}

function userMessage(text) {
  const row = el('div', 'msg user');
  row.append(el('div', 'text', text));
  thread.append(row);
  scrollDown();
}

function setComposer(enabled, placeholder = 'Type your answer...') {
  input.disabled = !enabled;
  input.placeholder = placeholder;
  send.disabled = !enabled || !input.value.trim();
  if (enabled) input.focus();
}

function ask() {
  const q = QUESTIONS[step];
  const body = botMessage();
  body.append(el('div', null, q.ask));
  if (q.choices) {
    const chips = el('div', 'chips');
    for (const choice of q.choices) {
      const chip = el('button', 'chip', choice);
      chip.type = 'button';
      chip.onclick = () => { if (!busy && QUESTIONS[step] === q) answer(choice); };
      chips.append(chip);
    }
    body.append(chips);
    setComposer(true, 'Or type "direct" or "warm"...');
  } else {
    setComposer(true);
  }
}

async function post(url, data) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  const json = await res.json().catch(() => ({ error: `Server error (${res.status})` }));
  if (!res.ok) throw new Error(json.error || `Server error (${res.status})`);
  return json;
}

function answer(raw) {
  const value = raw.trim();
  if (!value) return;
  const q = QUESTIONS[step];
  if (q.key === 'tone' && !['direct', 'warm'].includes(value.toLowerCase())) {
    userMessage(value);
    botMessage().append(el('div', null, 'Please pick "Direct" or "Warm".'));
    return;
  }
  userMessage(value);
  answers[q.key] = q.key === 'tone' ? value.toLowerCase() : value;

  // Start the slow company lookup right away, while the user keeps typing.
  if (q.key === 'companyName') {
    lookupId = null;
    post('/api/lookup', { companyName: value }).then((r) => { lookupId = r.lookupId; }).catch(() => {});
  }

  step += 1;
  if (step < QUESTIONS.length) ask();
  else generate();
}

async function generate() {
  busy = true;
  setComposer(false, 'Writing...');
  const body = botMessage();
  const status = el('div', 'thinking', `Looking up ${answers.companyName} and writing the email`);
  body.append(status);
  try {
    const r = await post('/api/generate', { ...answers, lookupId });
    status.remove();
    renderResult(body, r);
  } catch (e) {
    status.className = 'error';
    status.textContent = `Sorry, that failed: ${e.message}`;
    body.append(actionsRow([['Try again', () => generate()], ['New email', reset]]));
  }
  busy = false;
  setComposer(false, 'Use the buttons above');
  scrollDown();
}

function actionsRow(buttons) {
  const row = el('div', 'actions');
  for (const [label, fn] of buttons) {
    const b = el('button', null, label);
    b.type = 'button';
    b.onclick = () => fn(b);
    row.append(b);
  }
  return row;
}

function renderResult(body, r) {
  if (r.ok) {
    body.append(el('div', null, `Here's your email for ${answers.companyName}:`));
    const card = el('div', 'card');
    card.append(el('pre', null, r.email));
    card.append(actionsRow([
      ['Copy', async (b) => {
        try { await navigator.clipboard.writeText(r.email); b.textContent = 'Copied'; }
        catch { b.textContent = 'Copy failed'; }
        setTimeout(() => { b.textContent = 'Copy'; }, 1500);
      }],
      ['Regenerate', () => !busy && generate()],
      ['New email', () => !busy && reset()],
    ]));
    body.append(card);
  } else {
    body.append(el('div', 'error', `No version passed every rule after ${r.attempts} attempts, so nothing is shown. Problems:`));
    for (const v of r.violations) body.append(el('div', 'note', `• ${v}`));
    body.append(actionsRow([['Try again', () => !busy && generate()], ['New email', () => !busy && reset()]]));
  }
  for (const w of r.warnings) body.append(el('div', 'note', `Note: ${w}`));

  const facts = r.helperFactsUsed?.length ? r.helperFactsUsed.join('; ') : 'none';
  body.append(el('div', 'meta', `Written as: ${r.accountType} · helper facts used: ${facts} · ${r.seconds}s`));
  const details = el('details');
  details.append(el('summary', null, 'Why this email'));
  details.append(el('pre', null, r.explanation.join('\n')));
  body.append(details);
}

function reset() {
  answers = {};
  step = 0;
  lookupId = null;
  thread.append(el('hr', null));
  thread.lastChild.style.cssText = 'border:0;border-top:1px solid var(--line);margin:4px 0;width:100%';
  ask();
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = `${Math.min(input.scrollHeight, 160)}px`;
  send.disabled = input.disabled || !input.value.trim();
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    form.requestSubmit();
  }
});
form.addEventListener('submit', (e) => {
  e.preventDefault();
  if (busy || input.disabled || !input.value.trim()) return;
  const value = input.value;
  input.value = '';
  input.style.height = 'auto';
  send.disabled = true;
  answer(value);
});

ask();
</script>
</body>
</html>
